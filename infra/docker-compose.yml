# =====================================================================
# Despliegue de produccion - Sistema de Monitoreo Energetico (Retse, S.A.)
#
# REGLA DE EXPOSICION: solo el proxy inverso publica puertos hacia el
# exterior. MySQL y el servicio Python permanecen en la red interna.
#
#   docker compose --env-file ../.env up -d --build
# =====================================================================

name: appsolar

services:
  # -------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: appsolar-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-06:00
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-appsolar}
      MYSQL_USER: ${DB_USER:-appsolar}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes:
      - mysql_datos:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    networks: [interna]
    # Sin `ports`: la base de datos NUNCA se publica hacia Internet.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # -------------------------------------------------------------------
  python:
    build:
      context: ..
      dockerfile: infra/python.Dockerfile
    container_name: appsolar-python
    restart: unless-stopped
    environment:
      PYTHON_SERVICE_HOST: 0.0.0.0
      PYTHON_SERVICE_PORT: 8000
      PYTHON_SERVICE_TOKEN: ${PYTHON_SERVICE_TOKEN:?defina PYTHON_SERVICE_TOKEN}
      HUAWEI_MODE: ${HUAWEI_MODE:-mock}
      HUAWEI_BASE_URL: ${HUAWEI_BASE_URL:-https://intl.fusionsolar.huawei.com/thirdData}
      HUAWEI_USERNAME: ${HUAWEI_USERNAME:-}
      HUAWEI_SYSTEM_CODE: ${HUAWEI_SYSTEM_CODE:-}
      HUAWEI_TIMEOUT_S: ${HUAWEI_TIMEOUT_S:-40}
      HUAWEI_MAX_RETRIES: ${HUAWEI_MAX_RETRIES:-3}
      HUAWEI_AUTHORIZED_IP: ${HUAWEI_AUTHORIZED_IP:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: America/Guatemala
    networks: [interna]
    # Sin `ports`: el adaptador solo es accesible desde el backend.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; r=urllib.request.Request('http://127.0.0.1:8000/health', headers={'x-service-token': os.environ['PYTHON_SERVICE_TOKEN']}); sys.exit(0 if urllib.request.urlopen(r, timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  # -------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    container_name: appsolar-backend
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      python: { condition: service_started }
    environment:
      NODE_ENV: production
      TZ: America/Guatemala
      PORT: 4000
      HOST: 0.0.0.0
      APP_NAME: ${APP_NAME:-Monitoreo Energetico Retse}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?defina APP_PUBLIC_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS}
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-appsolar}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-appsolar}
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PYTHON_SERVICE_URL: http://python:8000
      PYTHON_SERVICE_TOKEN: ${PYTHON_SERVICE_TOKEN}
      HUAWEI_MODE: ${HUAWEI_MODE:-mock}
      HUAWEI_AUTHORIZED_IP: ${HUAWEI_AUTHORIZED_IP:-}
      SYNC_CRON_ENABLED: ${SYNC_CRON_ENABLED:-false}
      SYNC_CRON_HOUR: ${SYNC_CRON_HOUR:-2}
      SYNC_CRON_MINUTE: ${SYNC_CRON_MINUTE:-30}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?defina BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador del Sistema}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?defina BOOTSTRAP_ADMIN_PASSWORD}
      SEED_DEMO_DATA: "false"
      UPLOAD_DIR: /datos/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    volumes:
      - cargas:/datos/uploads
    networks: [interna]
    # Las migraciones se aplican SIEMPRE antes de arrancar el servicio.
    command: >
      sh -c "node dist/db/cli.js migrate &&
             node dist/db/cli.js bootstrap &&
             node dist/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: appsolar-proxy
    restart: unless-stopped
    depends_on:
      backend: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/appsolar.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_comun.inc:/etc/nginx/conf.d/proxy_comun.inc:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot
    networks: [interna]
    environment:
      TZ: America/Guatemala

volumes:
  mysql_datos:
  cargas:
  certbot_webroot:

networks:
  interna:
    driver: bridge
