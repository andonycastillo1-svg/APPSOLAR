# =====================================================================
# Proxy inverso del Sistema de Monitoreo Energetico - Retse, S.A.
#
# Unico servicio expuesto a Internet. Publica HTTPS y reenvia al backend
# Node.js por la red interna. MySQL y el servicio Python no son accesibles
# desde el exterior en ninguna circunstancia.
#
# Sustituya `monitoreo.retse.com.gt` por el subdominio institucional real.
# =====================================================================

# ---------- Limitadores de peticiones ----------
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ingreso:10m rate=1r/s;

# ---------- HTTP: renovacion de certificado y redireccion a HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name monitoreo.retse.com.gt;

    # Desafio ACME de Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitoreo.retse.com.gt;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # HSTS: solo tras confirmar que el certificado funciona correctamente.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # El resto de cabeceras de seguridad (CSP incluida) las emite el backend.

    server_tokens off;
    client_max_body_size 12M;   # coherente con MAX_UPLOAD_MB (10 MB) + margen
    client_body_timeout  60s;

    # Compresion de respuestas de texto.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/appsolar_acceso.log;
    error_log  /var/log/nginx/appsolar_error.log warn;

    # ---------- Endurecimiento del inicio de sesion ----------
    location = /api/auth/login {
        limit_req zone=ingreso burst=5 nodelay;
        proxy_pass http://backend:4000;
        include /etc/nginx/conf.d/proxy_comun.inc;
    }

    # ---------- API ----------
    location /api/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://backend:4000;
        include /etc/nginx/conf.d/proxy_comun.inc;

        # Las sincronizaciones y exportaciones pueden tardar.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- Estado de salud ----------
    location /health {
        proxy_pass http://backend:4000;
        include /etc/nginx/conf.d/proxy_comun.inc;
        access_log off;
    }

    # ---------- Frontend (SPA servida por el backend) ----------
    location / {
        proxy_pass http://backend:4000;
        include /etc/nginx/conf.d/proxy_comun.inc;
    }

    # Los archivos con huella de contenido pueden cachearse por mucho tiempo.
    location /assets/ {
        proxy_pass http://backend:4000;
        include /etc/nginx/conf.d/proxy_comun.inc;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
